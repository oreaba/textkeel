[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "textkeel"
dynamic = ["version"]
description = "One extractor for PDF, Word, Excel, PowerPoint, HTML, Markdown, CSV, text and images, with one structured output. Arabic and English, no language model."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["text-extraction", "pdf", "docx", "xlsx", "pptx", "arabic", "rag", "chunking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Topic :: Text Processing",
]
# Before a PyPI upload, publish pdf-ar there and replace the URL with "pdf-ar>=0.9":
# PyPI rejects direct URL dependencies.
dependencies = [
    "pdf-ar @ https://github.com/oreaba/pdf-ar/archive/5f104c8ec42e7837a75522c709304fdaac815143.zip",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
# Images, and PDFs with the ocr and auto engines. Tesseract 5 itself is installed outside pip.
ocr = [
    "pytesseract>=0.3.13",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "python-docx>=1.1",
]

[project.urls]
Homepage = "https://github.com/oreaba/textkeel"

[project.scripts]
textkeel = "textkeel.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "textkeel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
